<div id="root"></div>

<script>

window.storage = (function () {
  if (!("indexedDB" in window)) {
    return {
      async get(key) {
        const v = localStorage.getItem("invoiceapp:" + key);
        if (v === null) throw new Error("not found");
        return { key, value: v };
      },
      async set(key, value) {
        localStorage.setItem("invoiceapp:" + key, value);
        return { key, value };
      },
      async delete(key) {
        localStorage.removeItem("invoiceapp:" + key);
        return { key, deleted: true };
      },
      async list(prefix) {
        const p = "invoiceapp:" + (prefix || "");
        return { keys: Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(11)) };
      },
    };
  }
  const DB_NAME = "qoratech-invoices";
  const STORE = "kv";
  let dbPromise = null;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function getDB() {
    if (!dbPromise) dbPromise = openDB();
    return dbPromise;
  }
  return {
    async get(key) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
        req.onsuccess = () => {
          if (req.result === undefined) reject(new Error("not found"));
          else resolve({ key, value: req.result });
        };
        req.onerror = () => reject(req.error);
      });
    },
    async set(key, value) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = () => resolve({ key, value });
        tx.onerror = () => reject(tx.error);
      });
    },
    async delete(key) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve({ key, deleted: true });
        tx.onerror = () => reject(tx.error);
      });
    },
    async list(prefix) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, "readonly").objectStore(STORE).getAllKeys();
        req.onsuccess = () => resolve({ keys: req.result.filter((k) => !prefix || k.startsWith(prefix)) });
        req.onerror = () => reject(req.error);
      });
    },
  };
})();

window.addEventListener("error", function (e) {
  var root = document.getElementById("root");
  if (root && !root.hasChildNodes()) {
    root.innerHTML = '<div style="font-family:monospace;padding:24px;color:#B5453A;white-space:pre-wrap;">Something failed to load:\n\n' +
      (e.message || e) + '</div>';
  }
});

function __imgFmt(u) {
  var m = /data:image\/(\w+);/.exec(u || "");
  if (!m) return "PNG";
  var f = m[1].toUpperCase();
  return f === "JPG" ? "JPEG" : f;
}

window.__invoicePdf = async function (l, t, e, calc) {
  var jsPDF = window.jspdf.jsPDF;
  var PDFTPL = {
    minimal: { accent: [31,122,100], soft: [228,241,236], font: "helvetica", header: "plain", align: "left", divider: "solid", totalBox: false, narrow: false },
    modern: { accent: [42,92,214], soft: [231,237,251], font: "helvetica", header: "band", align: "left", divider: "solid", totalBox: true, narrow: false },
    classic: { accent: [31,58,95], soft: [231,236,242], font: "times", header: "letterhead", align: "center", divider: "double", totalBox: false, narrow: false },
    bold: { accent: [217,83,30], soft: [251,231,220], font: "helvetica", header: "band", align: "left", divider: "solid", totalBox: true, narrow: false },
    receipt: { accent: [22,32,43], soft: [238,238,238], font: "courier", header: "receipt", align: "center", divider: "dashed", totalBox: false, narrow: true }
  };
  var tp = PDFTPL[e.template] || PDFTPL.minimal;
  var doc = new jsPDF({ unit: "mm", format: "a4" });
  var pw = doc.internal.pageSize.getWidth();
  var mg = tp.narrow ? pw * 0.22 : 18;
  var rightX = pw - mg;
  var y = mg;
  var cur = e.currency || "RM";
  var money = function (n) { return cur + " " + (Number(n) || 0).toFixed(2); };
  var gray = [130,130,130], ink = [26,32,44];
  var fmtDate = function (s) { if (!s) return ""; var d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
  var setDash = function (on) { doc.setLineDashPattern(on ? [1, 1] : [], 0); };
  var line = function (x1, yy, x2) {
    setDash(tp.divider === "dashed");
    if (tp.divider === "dashed") doc.setDrawColor(170, 170, 170); else doc.setDrawColor(210, 210, 210);
    doc.line(x1, yy, x2, yy);
    if (tp.divider === "double") doc.line(x1, yy + 0.8, x2, yy + 0.8);
    setDash(false);
  };

  if (tp.header === "band") {
    doc.setFillColor.apply(doc, tp.accent);
    doc.rect(0, 0, pw, 34, "F");
    if (e.logoDataUrl) { try { doc.addImage(e.logoDataUrl, __imgFmt(e.logoDataUrl), mg, 8, 20, 10); } catch (err) {} }
    doc.setFont(tp.font, "normal"); doc.setFontSize(9); doc.setTextColor(255, 255, 255);
    doc.text("INVOICE", mg, e.logoDataUrl ? 26 : 14);
    doc.setFont(tp.font, "bold"); doc.setFontSize(16); doc.setTextColor(255, 255, 255);
    doc.text(l.invoiceNumber || "", mg, e.logoDataUrl ? 33 : 22);
    y = 44;
  } else if (tp.header === "letterhead") {
    if (e.logoDataUrl) { try { doc.addImage(e.logoDataUrl, __imgFmt(e.logoDataUrl), pw / 2 - 13, y, 26, 13); y += 16; } catch (err) {} }
    doc.setFont(tp.font, "bold"); doc.setFontSize(14); doc.setTextColor.apply(doc, tp.accent);
    doc.text(e.businessName || "", pw / 2, y + 4, { align: "center" }); y += 10;
    line(pw / 2 - 30, y, pw / 2 + 30); y += 8;
    doc.setFont(tp.font, "normal"); doc.setFontSize(8); doc.setTextColor.apply(doc, gray);
    doc.text("INVOICE", pw / 2, y, { align: "center" }); y += 6;
    doc.setFont(tp.font, "bold"); doc.setFontSize(14); doc.setTextColor.apply(doc, ink);
    doc.text(l.invoiceNumber || "", pw / 2, y, { align: "center" }); y += 12;
  } else if (tp.header === "receipt") {
    doc.setFont(tp.font, "bold"); doc.setFontSize(10); doc.setTextColor.apply(doc, ink);
    doc.text((e.businessName || "").toUpperCase(), pw / 2, y + 4, { align: "center" }); y += 8;
    if (e.businessAddress) {
      var al = doc.splitTextToSize(e.businessAddress, pw - mg * 2);
      doc.setFont(tp.font, "normal"); doc.setFontSize(7); doc.setTextColor.apply(doc, gray);
      doc.text(al, pw / 2, y, { align: "center" }); y += al.length * 3.6 + 3;
    }
